<style>
:root{
  --night:#000000;
  --ink:#f3f3f1;
  --muted:rgba(243,243,241,.58);
  --faint:rgba(255,255,255,.13);
  --silver:#c7cbd0;
  --graphite:#5d6167;
  --pearl:#e8eaec;
  --card:rgba(255,255,255,.04);
  --ease:cubic-bezier(.22,1,.36,1);
  --serif:"Frank Ruhl Libre",Georgia,serif;
  --sans:"Heebo",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--night);
  color:var(--ink);
  font:300 17px/1.6 var(--sans);
  min-height:100dvh;
  display:flex;flex-direction:column;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
bdi{font-family:inherit;white-space:nowrap}
.mark{white-space:nowrap}

/* ---------- liquid background ---------- */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(120% 90% at 80% 0%, #151516 0%, var(--night) 62%)}
.blobs{position:absolute;inset:-20%;
  transform:translate(var(--dx,0),var(--dy,0)) rotate(var(--rot,0deg));
  transition:transform 2.8s var(--ease)}
.blob{position:absolute;border-radius:50%;filter:blur(80px);mix-blend-mode:screen;opacity:.55}
.b1{width:62vmax;height:62vmax;left:8%;top:4%;
  background:radial-gradient(circle at 40% 40%, rgba(150,155,162,.42), rgba(150,155,162,0) 68%);
  animation:morph1 22s ease-in-out infinite alternate}
.b2{width:48vmax;height:48vmax;right:4%;top:38%;
  background:radial-gradient(circle at 50% 50%, rgba(215,219,224,.26), rgba(215,219,224,0) 66%);
  animation:morph2 26s ease-in-out infinite alternate}
.b3{width:36vmax;height:36vmax;left:30%;bottom:2%;
  background:radial-gradient(circle at 50% 50%, rgba(255,255,255,.16), rgba(255,255,255,0) 64%);
  animation:morph3 30s ease-in-out infinite alternate}
@keyframes morph1{0%{transform:translate(0,0) scale(1);border-radius:46% 54% 52% 48%}
  100%{transform:translate(6vw,8vh) scale(1.12);border-radius:58% 42% 40% 60%}}
@keyframes morph2{0%{transform:translate(0,0) scale(1.05)}
  100%{transform:translate(-8vw,-6vh) scale(.9)}}
@keyframes morph3{0%{transform:translate(0,0) scale(.95)}
  100%{transform:translate(5vw,-10vh) scale(1.15)}}
.grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* ---------- frame ---------- */
.top,.bottom,main{position:relative;z-index:1}
.top{padding:calc(18px + env(safe-area-inset-top)) 22px 0;max-width:620px;width:100%;margin:0 auto}
.brandline{display:flex;align-items:center;justify-content:space-between;gap:16px}
.mark{font:400 19px/1 var(--serif);letter-spacing:.02em;color:var(--pearl)}
.chap{font:300 13px/1 var(--sans);color:var(--muted);transition:opacity .6s var(--ease)}
.progress{margin-top:14px;display:flex;gap:6px}
.seg{flex:1;height:2px;background:var(--faint);border-radius:2px;overflow:hidden}
.seg i{display:block;height:100%;width:0;border-radius:2px;
  background:linear-gradient(270deg,#ffffff,var(--silver));
  transition:width 1.1s var(--ease)}
main{flex:1;position:relative;max-width:620px;width:100%;margin:0 auto}
.bottom{padding:0 22px calc(16px + env(safe-area-inset-bottom));max-width:620px;width:100%;margin:0 auto;min-height:56px;display:flex;align-items:center}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);
  font:400 15px var(--sans);padding:10px 4px;cursor:pointer;transition:color .3s}
.back:hover{color:var(--ink)}
.back svg{width:16px;height:16px}
.back[hidden]{display:none}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow-y:auto;
  padding:28px 22px 24px;
  transition:opacity .75s var(--ease),transform .9s var(--ease),filter .9s var(--ease);
  will-change:opacity,transform,filter}
.screen .inner{margin:auto 0;width:100%}
.screen.enter{opacity:0;transform:translateY(34px) scale(.985);filter:blur(14px)}
.screen.leave{opacity:0;transform:translateY(-28px) scale(1.01);filter:blur(12px);pointer-events:none}
.screen.rev.enter{transform:translateY(-34px) scale(.985)}
.screen.rev.leave{transform:translateY(28px) scale(1.01)}

h1{font:400 clamp(26px,6.6vw,37px)/1.26 var(--serif);letter-spacing:-.005em;margin-bottom:10px;text-wrap:balance}
.kick{font:400 15px/1.5 var(--sans);color:var(--silver);margin-bottom:12px;max-width:44ch}
.sub{color:var(--muted);font-size:16px;margin-bottom:6px;max-width:44ch}
.qtext{margin-bottom:26px}

/* welcome */
.lede p{max-width:46ch;margin-bottom:12px}
.lede p.soft{color:var(--muted)}
.anon{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-radius:18px;
  background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.15);margin:18px 0 14px;max-width:46ch}
.anon svg{flex:none;width:20px;height:20px;margin-top:3px;color:var(--silver)}
.anon b{font-weight:500;color:var(--ink)}
.meta{color:var(--muted);font-size:14px;margin-bottom:24px;max-width:46ch}

/* option cards */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{position:relative;overflow:hidden;width:100%;text-align:right;cursor:pointer;
  display:flex;align-items:center;gap:14px;
  padding:18px 20px;border-radius:22px;
  background:var(--card);border:1px solid var(--faint);color:var(--ink);
  font:400 17px/1.4 var(--sans);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  transition:border-color .4s var(--ease),background .5s var(--ease),box-shadow .6s var(--ease),transform .25s var(--ease)}
.opt:active{transform:scale(.985)}
@media (hover:hover){.opt:hover,.chip:hover{border-color:rgba(255,255,255,.4)}}
.opt .dot{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);
  transition:all .45s var(--ease);position:relative}
.multi .opt .dot{border-radius:7px}
.opt.sel,.chip.sel{background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.04));
  border-color:rgba(232,234,236,.85);
  box-shadow:0 18px 50px -22px rgba(255,255,255,.38),inset 0 1px 0 rgba(255,255,255,.14)}
.opt.sel .dot{background:#fff;border-color:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.12)}
.multi .opt.sel .dot::after{content:"";position:absolute;left:50%;top:50%;width:5px;height:10px;
  border:solid var(--night);border-width:0 2px 2px 0;transform:translate(-50%,-62%) rotate(45deg)}
.ripple{position:absolute;width:14px;height:14px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.5),rgba(255,255,255,0) 70%);
  transform:translate(-50%,-50%) scale(0);animation:rip 1s var(--ease) forwards}
@keyframes rip{to{transform:translate(-50%,-50%) scale(70);opacity:0}}

/* word chips */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{position:relative;overflow:hidden;cursor:pointer;padding:12px 20px;border-radius:999px;
  background:var(--card);border:1px solid var(--faint);color:var(--ink);
  font:400 17px/1.2 var(--serif);
  transition:border-color .4s var(--ease),background .5s var(--ease),box-shadow .6s var(--ease),opacity .4s,transform .25s var(--ease)}
.chip:active{transform:scale(.97)}
.chip.off{opacity:.32;cursor:default}

/* scale */
.scale{display:flex;gap:8px;justify-content:space-between}
.pt{flex:1;max-width:58px;aspect-ratio:1;border-radius:50%;cursor:pointer;position:relative;overflow:hidden;
  background:var(--card);border:1px solid var(--faint);color:var(--ink);
  font:400 20px/1 var(--serif);
  transition:all .45s var(--ease)}
@media (hover:hover){.pt:hover{border-color:rgba(255,255,255,.45)}}
.pt.sel{background:radial-gradient(circle at 35% 30%,#ffffff,#9ca1a7);border-color:transparent;color:#000;
  box-shadow:0 12px 34px -12px rgba(255,255,255,.5);transform:scale(1.08)}
.ends{display:flex;justify-content:space-between;margin-top:12px;color:var(--muted);font-size:14px}
.pair{margin-bottom:24px}
.pairlabel{color:var(--silver);font-size:15px;margin-bottom:10px}

/* fields */
.field{width:100%;background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.28);
  color:var(--ink);font:300 21px/1.45 var(--serif);padding:10px 2px;outline:none;transition:border-color .4s}
.field:focus{border-color:#fff}
.area{width:100%;min-height:140px;resize:vertical;background:var(--card);border:1px solid var(--faint);border-radius:20px;
  color:var(--ink);font:300 17px/1.6 var(--sans);padding:16px 18px;outline:none;transition:border-color .4s}
.area:focus{border-color:rgba(255,255,255,.55)}
.field::placeholder,.area::placeholder{color:rgba(255,255,255,.3)}
.detail{margin-top:14px;display:none}
.detail.on{display:block;animation:open .6s var(--ease)}
@keyframes open{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.note{color:var(--muted);font-size:13.5px;line-height:1.55;margin-top:8px;max-width:46ch}
.letter p{max-width:44ch;margin-bottom:12px;font-size:17.5px;line-height:1.65}
.sign{margin:18px 0 6px;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.sign::before{content:"";width:36px;height:1px;background:linear-gradient(270deg,var(--silver),transparent);margin-bottom:12px}
.sign b{font:300 17px/1.2 var(--serif);color:var(--pearl);letter-spacing:.01em;font-weight:300}
.sign span{font-size:13px;color:var(--muted)}
.again{margin-top:28px}
.wink{font:300 clamp(22px,5.4vw,27px)/1.35 var(--serif);color:var(--pearl);margin:18px 0 6px;max-width:30ch}

/* actions */
.actions{display:flex;align-items:center;gap:18px;margin-top:28px;flex-wrap:wrap}
.btn{border:0;cursor:pointer;border-radius:999px;padding:16px 34px;
  font:500 17px/1 var(--sans);color:#000;
  background:linear-gradient(120deg,#ffffff,#b8bdc3);
  box-shadow:0 16px 44px -18px rgba(255,255,255,.45);
  transition:transform .3s var(--ease),opacity .3s,box-shadow .4s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.3;cursor:default;box-shadow:none}
.skip{background:none;border:0;color:var(--muted);font:400 15px var(--sans);cursor:pointer;
  text-decoration:underline;text-underline-offset:5px;text-decoration-color:rgba(255,255,255,.3);padding:8px 2px}
.skip:hover{color:var(--ink)}

.pulse{width:54px;height:54px;border-radius:50%;margin-bottom:26px;
  background:radial-gradient(circle at 35% 30%,#ffffff,#8e9399);
  animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.85);opacity:.6}50%{transform:scale(1.05);opacity:1}}

:focus-visible{outline:2px solid var(--pearl);outline-offset:3px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
  .screen.enter,.screen.leave{filter:none;transform:none}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="blobs"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
  <div class="grain"></div>
</div>

<header class="top">
  <div class="brandline">
    <span class="chap" id="chap"></span>
  </div>
  <div class="progress" id="progress" aria-hidden="true"></div>
</header>

<main id="stage" aria-live="polite"></main>

<footer class="bottom">
  <button class="back" id="back" type="button" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    חזרה
  </button>
</footer>

<script>
/* =========================================================
   הדביקו כאן את כתובת ה-Web App של Google Apps Script.
   כל עוד השדה ריק, הטופס עובד במצב תצוגה ולא שולח כלום.
   ========================================================= */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzqvYw_-A22AtiC1hZqJrSFO3lXJj_DFJ-8s1IHol6wfWZsLBt0rUkN575-QKdrY5v-vQ/exec";

/* ---------- wording by respondent: p = couple / default, f = woman, m = man ---------- */
const CHAPTERS = ["השימוש","הרושם הראשון","בזמן השימוש","אחרי השימוש","מילה אחרונה"];
const NOT_SURE = {label:"לא יודעים", f:"לא יודעת", m:"לא יודע"};

const Q = {
  q1:{ch:0,type:"single",required:true,col:"1. מי ממלא",
      sub:"חשבו על הפעם האחרונה שהשתמשתם במוצר.",
      title:"מי ממלא את השאלון?",options:["אישה","גבר","זוג"]},
  q2:{ch:0,aud:["f","m"],type:"single",col:"2. לבד או עם בן/בת זוג",
      title:"השתמשת במוצר לבד או עם בן או בת זוג?",options:["לבד","עם בן או בת זוג"]},
  q3:{ch:0,type:"single",col:"3. משך השימוש",title:"בערך כמה זמן נמשך השימוש?",
      options:["פחות מ-10 דקות","10 עד 30 דקות","יותר מחצי שעה"]},

  q4:{ch:1,type:"chips",max:5,col:"4. מילים שמתארות את המוצר",
      kick:{p:"לפני הפרטים, ענו מהבטן.",f:"לפני הפרטים, עני מהבטן.",m:"לפני הפרטים, ענה מהבטן."},
      title:"אילו מילים הכי מתארות את המוצר?",sub:"אפשר לבחור עד 5.",
      options:["משיי","קטיפתי","חלק","קליל","עשיר","טבעי","יוקרתי","נעים","סמיך","דליל","דביק","שמנוני"]},
  q5:{ch:1,aud:["f","m"],type:"scale",col:"5. כמה אהבו את המוצר (1-7)",
      title:{p:"באופן כללי, כמה אהבתם את המוצר?",f:"באופן כללי, כמה אהבת את המוצר?",m:"באופן כללי, כמה אהבת את המוצר?"},
      min:1,max:7,lo:"בכלל לא",hi:"מאוד"},

  w6:{ch:1,aud:["f"],type:"single",col:"6א. אישה: אופן השימוש",title:"איך השתמשת במוצר?",options:["עם היד בלבד","עם אביזר","גם וגם"]},
  w7:{ch:1,aud:["f"],type:"scale",col:"7א. אישה: תחושה על הגוף (1-7)",title:"איך המוצר הרגיש על הגוף?",min:1,max:7,lo:"לא נעים",hi:"נעים מאוד"},
  w8:{ch:1,aud:["f"],type:"single",col:"8א. אישה: נוחות לאורך השימוש",title:"האם המוצר עזר לך להרגיש בנוח לאורך כל השימוש?",options:["כן, לגמרי","חלקית","לא"]},

  m6:{ch:1,aud:["m"],type:"scale",col:"6ב. גבר: תחושה על העור (1-7)",title:"איך המוצר הרגיש על העור?",min:1,max:7,lo:"לא נעים",hi:"נעים מאוד"},
  m7:{ch:1,aud:["m"],type:"single",col:"7ב. גבר: תחושת המגע",title:"המגע עם המוצר הרגיש:",options:["טבעי ונעים","בסדר","מלאכותי או לא נעים"]},

  c67:{ch:1,aud:["p"],type:"scale2",title:"כמה כל אחד מכם אהב את המוצר?",sub:"כל אחד בנפרד. אין צורך להסכים.",
      min:1,max:7,lo:"בכלל לא",hi:"מאוד",
      rows:[{key:"c6",label:"בן או בת זוג א׳",col:"6ג. זוג: כמה אהב/ה, בן/בת זוג א׳ (1-7)"},
            {key:"c7",label:"בן או בת זוג ב׳",col:"7ג. זוג: כמה אהב/ה, בן/בת זוג ב׳ (1-7)"}]},
  c8:{ch:1,aud:["p"],type:"single",col:"8ג. זוג: הרגשתם אותו דבר",title:"האם הרגשתם אותו דבר לגבי המוצר?",
      options:["כן, די דומה","לא, אחד מאיתנו אהב יותר","לא בטוחים"]},

  q9:{ch:2,type:"single",col:"9. חלקלקות",
      kick:"עכשיו מדייקים את הנוסחה. בשאלות הבאות, האפשרות האמצעית היא \"כמו שצריך\".",
      title:"חלקלקות",options:["הרבה פחות מדי","קצת פחות מדי","כמו שצריך","קצת יותר מדי","הרבה יותר מדי"]},
  q10:{ch:2,type:"single",col:"10. סמיכות",title:"סמיכות",options:["דליל מדי","קצת דליל","כמו שצריך","קצת סמיך","סמיך מדי"]},
  q12:{ch:2,type:"single",col:"11. הוספה באמצע",
      title:{p:"אחרי כמה דקות של שימוש, הרגשתם שהחומר מתחיל להתייבש או להיספג, והייתם צריכים להוסיף עוד?",
             f:"אחרי כמה דקות של שימוש, הרגשת שהחומר מתחיל להתייבש או להיספג, והיית צריכה להוסיף עוד?",
             m:"אחרי כמה דקות של שימוש, הרגשת שהחומר מתחיל להתייבש או להיספג, והיית צריך להוסיף עוד?"},
      options:["לא, הכמות הראשונה הספיקה עד הסוף","כן, אחרי פחות מ-5 דקות","כן, אחרי 5 עד 15 דקות","כן, אחרי יותר מ-15 דקות"]},
  q13:{ch:2,type:"single",col:"12. קונדום",title:"אם השתמשתם בקונדום, איך זה עבד?",
      options:["לא השתמשנו בקונדום","בלי בעיה",
        {label:"הייתה בעיה",detail:{p:"ספרו לנו מה קרה ואיזה קונדום",f:"ספרי לנו מה קרה ואיזה קונדום",m:"ספר לנו מה קרה ואיזה קונדום"}}]},
  q14:{ch:2,aud:["m","p"],type:"single",col:"13. שימוש עם אביזר (גבר/זוג)",
      title:{p:"השתמשתם במוצר עם אביזר?",m:"השתמשת במוצר עם אביזר?"},options:["כן","לא"]},
  q15:{ch:2,type:"single",col:"14. חומר האביזר",title:"ממה עשוי האביזר?",

const SEQ = ["welcome","q1","q2","q3","q4","q5",
  "w6","w7","w8","m6","m7","c67","c8",
  "q9","q10","q12","q13","q14","q15","q16","q17","q31",
  "q18","q19","q20","q21","q22","q23","q24",
  "s_almost","q25","q26","q27","q29","q30"];

/* sheet columns, in order (detail fields follow their question) */
const COLS = [];
SEQ.forEach(id=>{
  const q=Q[id]; if(!q) return;
  if(q.type==="scale2"){ q.rows.forEach(r=>COLS.push({id:r.key,base:id,label:r.col})); return; }
  if(!q.col) return;
  COLS.push({id,label:q.col});
  if((q.options||[]).some(o=>typeof o==="object" && o.detail)) COLS.push({id:id+"_detail",base:id,label:q.col+" - פירוט"});
});

/* ---------- who is answering ---------- */
let answers = {}, history = [], current = null, busy = false;
const aud = () => answers.q1==="אישה" ? "f" : answers.q1==="גבר" ? "m" : "p";
const t = x => x==null ? "" : typeof x==="string" ? x : (x[aud()] ?? x.p ?? "");
const oLabel = o => typeof o==="string" ? o : o.label;
const oShow  = o => typeof o==="string" ? o : (o[aud()] ?? o.label);
const visible = id => { const q=Q[id]; return !q || !q.aud || q.aud.includes(aud()); };

/* ---------- branching ---------- */
function accessoryStep(){
  if(answers.q1==="אישה") return ["עם אביזר","גם וגם"].includes(answers.w6) ? "q15" : "q31";
  return "q14";
}
function nextOf(id){
  const a = answers;
  switch(id){
    case "q1":  return a.q1==="זוג" ? "q3" : "q2";
    case "q4":  return a.q1==="זוג" ? "c67" : "q5";
    case "q5":  return a.q1==="אישה" ? "w6" : a.q1==="גבר" ? "m6" : "c67";
    case "w8": case "m7": case "c8": return "q9";
    case "q12": return (a.q1==="זוג" || a.q2==="עם בן או בת זוג") ? "q13" : accessoryStep();
    case "q13": return accessoryStep();
    case "q14": return a.q14==="כן" ? "q15" : "q31";
    case "q17": return "q31";
    case "q22": return a.q22==="זו הפעם הראשונה" ? "s_almost" : "q23";
    case "q30": return "submit";
  }
  return SEQ[SEQ.indexOf(id)+1];
}

/* ---------- dom ---------- */
const stage = document.getElementById("stage");
const backBtn = document.getElementById("back");
const chapEl = document.getElementById("chap");
const progress = document.getElementById("progress");
const segs = CHAPTERS.map(()=>{ const s=document.createElement("span"); s.className="seg"; const i=document.createElement("i"); s.appendChild(i); progress.appendChild(s); return i; });

const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rich = s => esc(s);
function el(tag, cls, html){const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e;}
const LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>';

/* ---------- navigation ---------- */
function go(id, dir){
  current = id;
  const old = stage.querySelector(".screen.on");
  const scr = render(id);
  scr.classList.add("screen","enter"); if(dir<0) scr.classList.add("rev");
  stage.appendChild(scr);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ scr.classList.remove("enter"); scr.classList.add("on"); }));
  if(old){ old.classList.remove("on","rev"); if(dir<0) old.classList.add("rev"); old.classList.add("leave"); setTimeout(()=>old.remove(),950); }
  const focusable = scr.querySelector(".field,.area");
  if(focusable && matchMedia("(hover:hover)").matches) setTimeout(()=>focusable.focus({preventScroll:true}),700);
  chrome();
}
function lock(){ if(busy) return false; busy=true; setTimeout(()=>busy=false,700); return true; }
function next(){
  if(!lock()) return;
  const n = nextOf(current);
  if(n==="submit") return submit();
  const prevCh = Q[current] ? Q[current].ch : null;
  history.push(current); go(n, 1);
  if(Q[n] && prevCh!=null && Q[n].ch > prevCh) savePartial(false);   // save at the end of each chapter
}
function back(){
  if(!history.length || !lock()) return;
  go(history.pop(), -1);
}
backBtn.addEventListener("click", back);

/* chapter progress: whole chapters fill, the current one fills as you move through it */
function chrome(){
  const q = Q[current];
  const done = ["end","sending","error"].includes(current);
  let ch = -1, frac = 0;
  if(done) ch = CHAPTERS.length;
  else if(q && q.ch!=null){
    ch = q.ch;
    const ids = SEQ.filter(id => Q[id] && Q[id].ch===ch && visible(id));
    const i = Math.max(0, ids.indexOf(current));
    frac = .22 + .78*(i/ids.length);
  }
  segs.forEach((s,i)=>{ s.style.width = (i<ch ? 100 : i===ch ? Math.round(frac*100) : 0) + "%"; });
  chapEl.textContent = (ch>=0 && !done) ? CHAPTERS[ch] : "";
  backBtn.hidden = !(q && q.ch!=null) || history.length<=1;
  const s = history.length, r = document.documentElement.style;
  r.setProperty("--dx", (Math.sin(s*1.7)*7).toFixed(2)+"vw");
  r.setProperty("--dy", (Math.cos(s*1.3)*6).toFixed(2)+"vh");
  r.setProperty("--rot", (s*11)+"deg");
}

/* ---------- rendering helpers ---------- */
function ripple(e, target){
  const r = target.getBoundingClientRect();
  const x = (e && e.clientX) ? e.clientX - r.left : r.width/2;
  const y = (e && e.clientY) ? e.clientY - r.top : r.height/2;
  const s = el("span","ripple"); s.style.left=x+"px"; s.style.top=y+"px";
  target.appendChild(s); setTimeout(()=>s.remove(),1000);
}
function header(q){
  const box = el("div","qtext");
  const k = t(q.kick); if(k) box.appendChild(el("p","kick",rich(k)));
  box.appendChild(el("h1",null,rich(t(q.title))));
  const s = t(q.sub); if(s) box.appendChild(el("p","sub",rich(s)));
  const n = t(q.note); if(n) box.appendChild(el("p","note",rich(n)));
  return box;
}
function skipBtn(keys){
  const s = el("button","skip","דילוג"); s.type="button";
  s.addEventListener("click",()=>{ keys.forEach(k=>delete answers[k]); next(); });
  return s;
}
function actions(q, id, {label="המשך", disabled=false, skip=true}={}){
  const row = el("div","actions");
  const b = el("button","btn",label); b.type="button"; b.disabled=disabled; b.addEventListener("click",next);
  row.appendChild(b);
  if(skip && !q.required) row.appendChild(skipBtn([id, id+"_detail"]));
  return {row, btn:b};
}

/* ---------- screens ---------- */
function render(id){
  const q = Q[id] || {};
  const scr = el("section"); const inner = el("div","inner"); scr.appendChild(inner);

  if(id==="welcome"){
    inner.appendChild(el("h1",null,"היי, אנחנו קארן ויותם."));
    const letter = el("div","letter");
    letter.appendChild(el("p",null,"אנחנו מפתחים חומר סיכה חדש, והבקבוק שאצלכם הוא אחד מ-50 הראשונים שיוצרו."));
    letter.appendChild(el("p",null,"לפני שנחליט איך הוא ירגיש, ייראה ויגיע לשוק, חשוב לנו לשמוע מכם. בכנות, גם אם משהו לא עבד."));
    inner.appendChild(letter);
    inner.appendChild(el("div","anon", LOCK+'<span><b>השאלון אנונימי לחלוטין.</b> אנחנו לא אוספים שום פרט מזהה, ואין לנו שום דרך לדעת מי מילא אותו.</span>'));
    const b = el("button","btn","בואו נתחיל"); b.type="button"; b.style.marginTop="10px";
    b.addEventListener("click",()=>{ if(!lock()) return; startSession(); history=["welcome"]; go("q1",1); });
    inner.appendChild(b);
    return scr;
  }

  if(id==="sending"){
    inner.appendChild(el("div","pulse"));
    inner.appendChild(el("h1",null,t({p:"שולחים את התשובות שלכם",f:"שולחים את התשובות שלך",m:"שולחים את התשובות שלך"})));
    return scr;
  }

  if(id==="error"){
    inner.appendChild(el("h1",null,"התשובות עוד לא נשלחו"));
    inner.appendChild(el("p","sub",t({p:"נראה שאין חיבור לאינטרנט כרגע. בדקו את החיבור ונסו לשלוח שוב. התשובות שמורות בדף.",
      f:"נראה שאין חיבור לאינטרנט כרגע. בדקי את החיבור ונסי לשלוח שוב. התשובות שמורות בדף.",
      m:"נראה שאין חיבור לאינטרנט כרגע. בדוק את החיבור ונסה לשלוח שוב. התשובות שמורות בדף."})));
    const b = el("button","btn","שליחה חוזרת"); b.type="button"; b.addEventListener("click",()=>submit(true));
    const row = el("div","actions"); row.appendChild(b); inner.appendChild(row);
    return scr;
  }

  if(id==="end"){
    inner.appendChild(el("h1",null,"תודה."));
    inner.appendChild(el("p","sub",t({p:"המשוב שלכם יעזור לנו להביא את המוצר לשוק בצורה הטובה ביותר.",f:"המשוב שלך יעזור לנו להביא את המוצר לשוק בצורה הטובה ביותר.",m:"המשוב שלך יעזור לנו להביא את המוצר לשוק בצורה הטובה ביותר."})));
    inner.appendChild(el("p","wink",t({p:"תמשיכו ליהנות...",f:"תמשיכי ליהנות...",m:"תמשיך ליהנות..."})));
    inner.appendChild(el("div","sign","<b>קארן ויותם</b>"));
    inner.appendChild(el("p","sub again",t({p:"השתמשתם שוב בצורה אחרת, לבד, בזוג או עם אביזר? סרקו שוב את הקוד על הבקבוק, ונשמח לשאלון נוסף.",
      f:"השתמשת שוב בצורה אחרת, לבד, בזוג או עם אביזר? סרקי שוב את הקוד על הבקבוק, ונשמח לשאלון נוסף.",
      m:"השתמשת שוב בצורה אחרת, לבד, בזוג או עם אביזר? סרוק שוב את הקוד על הבקבוק, ונשמח לשאלון נוסף."})));
    inner.appendChild(el("div","anon", LOCK+'<span>השאלון אנונימי לחלוטין, ואין לנו שום דרך לדעת מי מילא אותו.</span>'));
    return scr;
  }

  if(q.type==="statement"){
    inner.appendChild(header(q));
    inner.appendChild(actions(q,id,{skip:false}).row);
    return scr;
  }

  inner.appendChild(header(q));

  /* single / multi / chips */
  if(q.type==="single" || q.type==="multi" || q.type==="chips"){
    const multi = q.type!=="single", chips = q.type==="chips";
    const list = el("div", chips ? "chips" : "opts"+(multi?" multi":""));
    list.setAttribute("role", multi ? "group" : "radiogroup");
    const hasDetail = q.options.some(o=>typeof o==="object" && o.detail);
    const act = (multi || hasDetail) ? actions(q,id,{disabled:true}) : null;
    let detailBox=null, detailArea=null;
    const refreshOff = ()=>{ if(!chips) return;
      const n=(answers[id]||[]).length;
      list.querySelectorAll(".chip").forEach(c=>c.classList.toggle("off", n>=q.max && !c.classList.contains("sel"))); };
    const openDetail = o => { detailArea.placeholder = t(o.detail); detailBox.classList.add("on"); };

    q.options.forEach(o=>{
      const label = oLabel(o);
      const b = el("button", chips ? "chip" : "opt"); b.type="button";
      b.innerHTML = chips ? '<span>'+rich(oShow(o))+'</span>' : '<span class="dot"></span><span>'+rich(oShow(o))+'</span>';
      const isSel = multi ? (answers[id]||[]).includes(label) : answers[id]===label;
      if(isSel) b.classList.add("sel");
      if(multi) b.setAttribute("aria-pressed", isSel?"true":"false");
      else { b.setAttribute("role","radio"); b.setAttribute("aria-checked", isSel?"true":"false"); }
      b.addEventListener("click",e=>{
        if(busy) return;
        if(multi){
          const arr = answers[id] ? [...answers[id]] : [];
          const i = arr.indexOf(label);
          if(i>-1) arr.splice(i,1);
          else { if(chips && arr.length>=q.max) return; arr.push(label); }
          ripple(e,b);
          answers[id]=arr; b.classList.toggle("sel", i===-1); b.setAttribute("aria-pressed", i===-1?"true":"false");
          act.btn.disabled = !arr.length; refreshOff();
          return;
        }
        ripple(e,b);
        answers[id]=label;
        list.querySelectorAll(".opt").forEach(x=>{x.classList.remove("sel");x.setAttribute("aria-checked","false")});
        b.classList.add("sel"); b.setAttribute("aria-checked","true");
        if(typeof o==="object" && o.detail){
          openDetail(o); act.btn.disabled=false;
          setTimeout(()=>detailArea.focus({preventScroll:false}),250);
          return;
        }
        if(detailBox){ detailBox.classList.remove("on"); delete answers[id+"_detail"]; act.btn.disabled=false; }
        setTimeout(next, 480);
      });
      list.appendChild(b);
    });
    inner.appendChild(list);
    if(hasDetail){
      detailBox = el("div","detail");
      detailArea = el("textarea","area"); detailArea.rows=3;
      detailArea.value = answers[id+"_detail"]||"";
      detailArea.addEventListener("input",()=>{ const v=detailArea.value.trim(); if(v) answers[id+"_detail"]=v; else delete answers[id+"_detail"]; });
      detailBox.appendChild(detailArea); inner.appendChild(detailBox);
      const chosen = q.options.find(o=>oLabel(o)===answers[id]);
      if(chosen){ act.btn.disabled=false; if(typeof chosen==="object" && chosen.detail) openDetail(chosen); }
    }
    if(multi && (answers[id]||[]).length){ act.btn.disabled=false; refreshOff(); }
    if(act) inner.appendChild(act.row);
    else if(!q.required){ const row=el("div","actions"); row.appendChild(skipBtn([id])); inner.appendChild(row); }
    return scr;
  }

  /* scales */
  const scaleRow = (key, onPick) => {
    const row = el("div","scale"); row.setAttribute("role","radiogroup");
    for(let v=q.min; v<=q.max; v++){
      const b = el("button","pt",String(v)); b.type="button"; b.setAttribute("role","radio");
      b.setAttribute("aria-label", v+(v===q.min?" ("+q.lo+")":v===q.max?" ("+q.hi+")":""));
      if(answers[key]===v) b.classList.add("sel");
      b.addEventListener("click",e=>{
        if(busy) return;
        answers[key]=v; ripple(e,b);
        row.querySelectorAll(".pt").forEach(x=>x.classList.remove("sel")); b.classList.add("sel");
        onPick();
      });
      row.appendChild(b);
    }
    return row;
  };
  const ends = () => el("div","ends",'<span>'+esc(q.lo)+'</span><span>'+esc(q.hi)+'</span>');

  if(q.type==="scale"){
    inner.appendChild(scaleRow(id, ()=>setTimeout(next,480)));
    inner.appendChild(ends());
    const a = el("div","actions"); a.appendChild(skipBtn([id])); inner.appendChild(a);
    return scr;
  }

  if(q.type==="scale2"){
    q.rows.forEach(r=>{
      const wrap = el("div","pair");
      wrap.appendChild(el("p","pairlabel",esc(r.label)));
      wrap.appendChild(scaleRow(r.key, ()=>{ if(q.rows.every(x=>answers[x.key]!=null)) setTimeout(next,560); }));
      inner.appendChild(wrap);
    });
    inner.lastChild.appendChild(ends());
    const a = el("div","actions"); a.appendChild(skipBtn(q.rows.map(r=>r.key))); inner.appendChild(a);
    return scr;
  }

  /* text */
  if(q.type==="text" || q.type==="long"){
    const f = q.type==="text" ? el("input","field") : el("textarea","area");
    if(q.type==="text"){ f.type="text"; f.enterKeyHint = q.last ? "send" : "next"; f.maxLength=200; }
    f.placeholder = t(q.placeholder); f.value = answers[id]||"";
    f.addEventListener("input",()=>{ const v=f.value.trim(); if(v) answers[id]=v; else delete answers[id]; });
    if(q.type==="text") f.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); next(); }});
    inner.appendChild(f);
    inner.appendChild(actions(q,id,{label: q.last ? "שליחה" : "המשך", skip: !q.last}).row);
    return scr;
  }
  return scr;
}

/* ---------- saving ----------
   Every questionnaire gets a random code (not linked to the person) so that
   partial saves and the final submit update the same row in the sheet. */
let sid = null, finished = false, lastSent = "";
function startSession(){
  try{ sid = crypto.randomUUID().slice(0,8); }catch(e){ sid = Math.random().toString(36).slice(2,10); }
  finished = false; lastSent = "";
}
function buildPayload(status, visited){
  const values = COLS.map(c=>{
    if(!visited.has(c.base || c.id)) return "";
    const v = answers[c.id];
    return v==null ? "" : Array.isArray(v) ? v.join(", ") : v;
  });
  const q = Q[current];
  const chapter = status==="הושלם" ? "סוף" : CHAPTERS[q && q.ch!=null ? q.ch : 0];
  return { id: sid, status, chapter, columns: COLS.map(c=>c.label), values };
}
function post(body, beacon){
  if(beacon && navigator.sendBeacon){
    return navigator.sendBeacon(SCRIPT_URL, new Blob([body],{type:"text/plain;charset=utf-8"}));
  }
  return fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",keepalive:true,
    headers:{"Content-Type":"text/plain;charset=utf-8"},body});
}
/* partial save: end of each chapter, and when the page is closed or hidden */
function savePartial(beacon){
  if(!SCRIPT_URL || !sid || finished || !answers.q1) return;
  const body = JSON.stringify(buildPayload("לא הושלם", new Set(history.concat([current]))));
  if(body===lastSent) return;
  lastSent = body;
  try{ const r = post(body, beacon); if(r && r.catch) r.catch(()=>{}); }catch(e){}
}
window.addEventListener("pagehide", ()=>savePartial(true));
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden") savePartial(true); });

/* final submit: only the questions on the path actually taken */
async function submit(retry){
  if(!retry) submit.path = new Set(history.concat([current]));
  const payload = buildPayload("הושלם", submit.path);
  go("sending", 1);
  try{
    if(!SCRIPT_URL){
      console.info("מצב תצוגה: התשובות לא נשלחו.", payload);
      await new Promise(r=>setTimeout(r,1100));
    }else{
      await post(JSON.stringify(payload), false);
      await new Promise(r=>setTimeout(r,500));
    }
    finished = true; submit.path = null;
    go("end", 1);
  }catch(err){
    go("error", 1);
  }
}

go("welcome", 1);
