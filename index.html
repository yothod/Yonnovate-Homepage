  <style>
    :root {
      --ink: #0B0C0C;
      --paper: #FFFFFF;
      --teal-light: #4EB5AF;
      --muted: #9D9F9E;
      --line: #2A2B2B;
      --sans: "Poppins", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      --serif: "Lora", Georgia, "Times New Roman", serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --gutter: clamp(24px, 5vw, 64px);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--ink);
      color: var(--paper);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      padding: max(40px, env(safe-area-inset-top)) var(--gutter) max(32px, env(safe-area-inset-bottom));
      overflow-x: hidden;
    }
    a { color: inherit; }
    a:focus-visible { outline: 2px solid var(--teal-light); outline-offset: 4px; }

    /* Header */
    .logo { display: block; width: 148px; height: auto; color: var(--paper); }

    /* Hero */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 1080px;
      padding-block: 64px;
    }
    .arc {
      display: block;
      width: min(calc(100% + var(--gutter)), 1040px);
      margin-left: calc(-1 * var(--gutter));
      height: auto;
      margin-bottom: clamp(28px, 4.5vw, 48px);
      color: var(--teal-light);
    }
    .arc path {
      transform-origin: 0 100%;
      animation: rise 900ms var(--ease) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px) scaleX(0.92); }
      to   { opacity: 1; transform: none; }
    }
    h1 {
      margin: 0;
      font-weight: 600;
      font-size: clamp(2.1rem, 5.4vw, 4.25rem);
      line-height: 1.08;
      letter-spacing: -0.025em;
      max-width: 16ch;
      text-wrap: balance;
    }
    .soon {
      margin: 28px 0 0;
      font-family: var(--serif);
      font-style: italic;
      font-weight: 500;
      font-size: clamp(1.125rem, 2vw, 1.375rem);
      color: var(--muted);
    }


    /* Partner logos: runs right to left */
    .partners {
      margin: 0 calc(-1 * var(--gutter)) 40px;
      padding-block: 8px;
    }
    .partners-label {
      margin: 0 var(--gutter) 20px;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .marquee {
      overflow: hidden;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
              mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
    }
    .marquee-track {
      display: flex;
      width: max-content;
      background: var(--ink);
      animation: run 48s linear infinite;
    }
    .marquee:hover .marquee-track { animation-play-state: paused; }
    .marquee ul {
      display: flex;
      align-items: center;
      gap: clamp(40px, 6vw, 80px);
      margin: 0;
      padding: 0 clamp(20px, 3vw, 40px);
      list-style: none;
    }
    .marquee li { flex: none; height: 44px; display: flex; align-items: center; }
    .marquee img {
      display: block;
      height: 32px;
      width: auto;
      max-width: 170px;
      object-fit: contain;
      /* Works for any logo file, with or without a background:
         grayscale + invert turns a dark logo on white into a light logo on black,
         and screen blending drops the black. */
      filter: grayscale(1) invert(1) brightness(1.5) contrast(1.4);
      mix-blend-mode: screen;
      opacity: 0.6;
      transition: opacity 200ms var(--ease);
    }
    .marquee li:hover img { opacity: 1; }
    .marquee .name {
      font-size: 1.125rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      color: var(--paper);
      opacity: 0.55;
    }
    @keyframes run {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    /* Footer */
    footer {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 32px;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--line);
      padding-top: 24px;
      font-size: 0.875rem;
      color: var(--muted);
    }
    .contact {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--paper);
      font-weight: 500;
    }
    .contact span {
      border-bottom: 1px solid var(--teal-light);
      padding-bottom: 2px;
      transition: color 200ms var(--ease);
    }
    .contact:hover span { color: var(--teal-light); }
    .contact svg { width: 18px; height: 18px; fill: none; stroke: var(--teal-light); stroke-width: 2; stroke-linecap: square; transition: transform 200ms var(--ease); }
    .contact:hover svg { transform: translateX(3px); }

    @media (max-width: 600px) {
      .logo { width: 120px; }
      main { padding-block: 48px; }
      footer { flex-direction: column; align-items: flex-start; }
      .marquee img { height: 26px; max-width: 130px; }
      .marquee .name { font-size: 1rem; }
      .marquee-track { animation-duration: 36s; }
    }
    @media (prefers-reduced-motion: reduce) {
      .arc path { animation: none; }
      .marquee { -webkit-mask-image: none; mask-image: none; }
      .marquee-track { animation: none; width: auto; }
      .marquee-track > ul[aria-hidden] { display: none; }
      .marquee ul { flex-wrap: wrap; row-gap: 20px; padding: 0 var(--gutter); }
      * { transition: none !important; }
    }
  </style>

    // If a logo can't load, the company name shows in its place.
    document.querySelectorAll('.marquee img').forEach(function (img) {
      function fail() {
        var s = document.createElement('span');
        s.className = 'name';
        s.textContent = img.alt;
        img.replaceWith(s);
      }
      img.addEventListener('error', fail);
      if (img.complete && img.naturalWidth === 0) fail();
    });
