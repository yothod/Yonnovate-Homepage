<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yonnovate — Coming Soon</title>
  <style>
    :root {
      --text: #ffffff;
      --muted: rgba(255,255,255,0.6);
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      color: var(--text);
      font-family: Inter, -apple-system, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px 60px;
    }
    /* LOGO */
    .logo {
      width: 130px;
    }
    /* HERO */
    .hero {
      margin-top: 80px;
      max-width: 1000px;
    }
    h1 {
      font-size: clamp(1.9rem, 3.6vw, 3.6rem);
      line-height: 1.15;
      margin: 0;
      letter-spacing: -0.02em;
      font-weight: 700;
      text-transform: uppercase;
      /* METALLIC SILVER SHINE */
      background: linear-gradient(
        100deg,
        #6e7173 0%,
        #8b8e91 10%,
        #b7bac0 20%,
        #e4e6ea 30%,
        #ffffff 40%,
        #e4e6ea 50%,
        #b7bac0 60%,
        #8b8e91 70%,
        #6e7173 80%,
        #8b8e91 90%,
        #b7bac0 100%
      );
      background-size: 320% auto;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
      animation: shine 22s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    @keyframes shine {
      0% { background-position: 260% center; }
      100% { background-position: -260% center; }
    }
    .soon {
      margin-top: 18px;
      font-size: 1.05rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    /* CONTACT */
    .footer {
      display: flex;
      justify-content: flex-end;
    }
    .contact {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.3);
      padding-bottom: 3px;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .contact:hover {
      border-color: rgba(255,255,255,0.7);
    }
    /* MOBILE */
    @media (max-width: 768px) {
      body {
        padding: 24px;
      }
      .logo {
        width: 100px;
        margin: 0 auto;
      }
      .hero {
        margin-top: 40px;
        text-align: center;
        max-width: 100%;
      }
      .footer {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <!-- LOGO -->
  <img class="logo" src="logo11.png" alt="Yonnovate logo" />
  <!-- HERO -->
  <div class="hero">
    <h1>Your bridge to health innovation across Israel & MENA</h1>
    <div class="soon">Launching soon</div>
  </div>
  <!-- CONTACT -->
  <div class="footer">
    <a class="contact" href="mailto:y@yonnovate.com">Contact</a>
  </div>
</body>
</html>
